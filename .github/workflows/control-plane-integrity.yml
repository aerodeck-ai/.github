name: control-plane integrity

# CI-TOPOLOGY A5, second half (R3). Companion to ci.yml — that one is the
# minimum functional build/typecheck/test-if-present gate; this one protects
# the control plane itself (workflows, gate manifests, CODEOWNERS, gate
# checker scripts) from self-alteration, closing the class of bypass proven
# exploitable by aerodeck-template PR #1936 (merged via a bot with zero human
# reviews, touching a gate checker script) and named NEGATIVE-WORKFLOW /
# NEGATIVE-RENAME in the row that filed this gate.
#
# Called by a repo with:
#   jobs:
#     control-plane-integrity:
#       uses: aerodeck-ai/.github/.github/workflows/control-plane-integrity.yml@main
#
# A calling repo extends coverage for its own runner/deploy config by adding
# a control-plane-owners.json at its root (see scripts/check-control-plane-integrity.mjs
# for the schema); the built-in protected globs (.github/workflows/**,
# CODEOWNERS, gate manifests, scripts/check-*.mjs) always apply regardless.
#
# checkout uses fetch-depth: 0 so the checker's `git fetch origin <base>` /
# `git show FETCH_HEAD:...` (reading the PROTECTED CONFIG from the base
# branch, not the PR's own copy — a PR can't widen its own escape hatch in
# the same change) has real history to work with.

on:
  workflow_call: {}

permissions:
  contents: read
  pull-requests: write # to request a review from a control-plane owner on block

concurrency:
  group: control-plane-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  control-plane-integrity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: fetch the shared checker
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -sSL -H "authorization: Bearer ${GITHUB_TOKEN}" \
            -H "accept: application/vnd.github.raw" \
            "https://api.github.com/repos/aerodeck-ai/.github/contents/scripts/check-control-plane-integrity.mjs?ref=main" \
            -o check-control-plane-integrity.mjs
          test -s check-control-plane-integrity.mjs
      - name: check control-plane surfaces
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node check-control-plane-integrity.mjs

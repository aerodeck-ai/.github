# Shared secret gate (reusable). One definition, three scopes, chosen by the event that called it. Every scan runs
# with `--redact`, so no secret value reaches the job log, the step summary or the report.
#
#   pull_request                   scans only the commits the PR adds (base..head). Blocks NEW secrets before merge.
#   push to the default branch     scans only the commits the push added (before..head). Catches a direct push or a
#                                  merge that skipped the PR check.
#   schedule / workflow_dispatch   scans the FULL history of every ref the checkout holds. This is the main-history
#                                  scan (G23, 22 Oct 2026): a finding fails the run and the step summary lists rule,
#                                  file, commit and line only, never the value.
#
# Server-side, so --no-verify cannot skip it.
#
# Why it exists (21 Oct 2026, estate-work#7635, scope estate-fanout-no-checkins-20261021): 77 of 85 aerodeck-ai
# repositories had no secret scan at all, and agents printed live secrets into their own output three times that day.
# One shared definition means a fix to the scan reaches every repository at once. infra keeps its own gitleaks.yml
# (same pinned binary, runs on ci-priority).
#
# Caller (each repository carries this, nothing else; the triggers live in the caller because a reusable workflow
# cannot add its own):
#   on:
#     pull_request: { types: [opened, synchronize, reopened, ready_for_review] }
#     push: { branches: [main] }
#     schedule: [{ cron: "17 3 * * 0" }]
#     workflow_dispatch:
#   jobs:
#     gitleaks:
#       if: ${{ !github.event.pull_request.draft }}
#       uses: aerodeck-ai/.github/.github/workflows/gitleaks.yml@main
#       with: { runner: ci-aeros }
name: gitleaks

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label the repository already uses for CI.
        type: string
        default: ci-aeros

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          V="${GITLEAKS_VERSION}"
          if command -v gitleaks >/dev/null 2>&1 && [ "$(gitleaks version)" = "${V}" ]; then
            gitleaks version
            exit 0
          fi
          # sha256 from the upstream gitleaks_8.30.1_checksums.txt (release v8.30.1, 21 Mar 2026).
          case "$(uname -m)" in
            x86_64)        ARCH=x64;   SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            aarch64|arm64) ARCH=arm64; SHA=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          # estate-work#5678: one lost download used to fail this required check, and a re-run of the same
          # commit then passed (10 such pairs from 29 Sep to 7 Oct). The download and its checksum are tried
          # up to four times with waits of 5, 15 and 45 seconds. A file that never matches the pinned sha256
          # is never installed, so the job still fails and no unverified binary runs. The scan below is not retried.
          GL_DIR="${GL_TMP:-/tmp}"
          fetched=false
          for pause in 0 5 15 45; do
            if [ "$pause" -gt 0 ]; then sleep "$pause"; fi
            rm -f "${GL_DIR}/gl.tgz"
            if curl -fsSL --connect-timeout 15 --max-time 60 -o "${GL_DIR}/gl.tgz" \
                 "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_${ARCH}.tar.gz" \
               && echo "${SHA}  ${GL_DIR}/gl.tgz" | sha256sum -c -; then
              fetched=true
              break
            fi
            echo "gitleaks download or checksum failed (attempt after a ${pause} s wait)" >&2
          done
          if [ "$fetched" != true ]; then
            echo "gitleaks ${V} could not be fetched and verified after 4 attempts" >&2
            exit 1
          fi
          tar xzf "${GL_DIR}/gl.tgz" -C "${GL_DIR}" gitleaks
          install -m755 "${GL_DIR}/gitleaks" "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version

      - name: Scan (scope follows the triggering event)
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          REPORT="${RUNNER_TEMP:-/tmp}/gitleaks-report.json"
          case "$EVENT" in
            pull_request|pull_request_target)
              SCOPE="commits this pull request adds (${BASE_SHA}..${HEAD_SHA})"
              OPTS="${BASE_SHA}..${HEAD_SHA}" ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                SCOPE="commits this push adds (${PUSH_BEFORE}..${PUSH_AFTER})"
                OPTS="${PUSH_BEFORE}..${PUSH_AFTER}"
              else
                SCOPE="head commit of a new or rewritten ref (${PUSH_AFTER})"
                OPTS="-1 ${PUSH_AFTER}"
              fi ;;
            *)
              SCOPE="FULL history of every ref in the checkout"
              OPTS="--all" ;;
          esac
          echo "scanning: ${SCOPE}"
          gitleaks git --no-banner --redact --verbose --exit-code 1 \
            --report-format json --report-path "$REPORT" \
            --log-opts="${OPTS}" .
          rc=$?
          if [ "$rc" -ne 0 ] && [ -s "$REPORT" ]; then
            {
              echo "### gitleaks findings (${SCOPE})"
              echo "Values are redacted and not recorded. Rotate the credential, then add the fingerprint to the repository's .gitleaksignore only if it is a false positive."
              echo
              echo "| Rule | File | Line | Commit | Fingerprint |"
              echo "|---|---|---|---|---|"
              python3 - "$REPORT" <<'PY' || echo "(summary unavailable: python3 missing on this runner)"
          import json, sys
          for f in json.load(open(sys.argv[1])):
              print("| {} | {} | {} | {} | {} |".format(f.get("RuleID"), f.get("File"), f.get("StartLine"), (f.get("Commit") or "")[:12], f.get("Fingerprint")))
          PY
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          rm -f "$REPORT"
          exit "$rc"

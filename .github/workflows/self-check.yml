name: self-check

# Wires this repo's own control-plane-integrity gate onto itself, so this
# repo (the org's sole enforcement mechanism for all 66 others) cannot be
# self-altered any more freely than the repos it protects.
#
# Uses a LOCAL path ref (./...) rather than @main: this workflow lives in
# the SAME repo as control-plane-integrity.yml, and a local ref resolves
# against the calling ref (this PR's own commit), not against main. An
# @main ref cannot work here before this PR's first merge — main doesn't
# have control-plane-integrity.yml yet, so that ref would 404 forever
# until merge, meaning self-check would never actually run pre-merge. This
# was caught live: the first two attempts used @main and both runs
# completed with zero jobs ("workflow file issue") instead of exercising
# the checker, silently NOT wargaming the gate despite looking like a
# pass/fail check-run.
#
# permissions: this repo's default workflow token is read-only
# (default_workflow_permissions=read); the called workflow requests
# pull-requests: write (to request review / comment on block), which
# exceeds a read-only token and fails closed with startup_failure unless
# explicitly granted here — reusable-workflow permissions are capped by
# the CALLER's grant, not just the callee's own request. Caught live: the
# first local-ref run resolved the reusable workflow correctly but still
# failed with startup_failure until this block was added.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  control-plane-integrity:
    uses: ./.github/workflows/control-plane-integrity.yml
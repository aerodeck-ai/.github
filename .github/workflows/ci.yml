name: Shared CI

# WHY THIS EXISTS (2026-07-30)
#
# Measured across all 66 repos in aerodeck-ai on 2026-07-30: 22 had workflows, 44 had none, and
# ZERO shared anything. aerodeck-template alone carried 29 workflow files, hermes-agent 22. Every
# repo hand-rolled its own CI, so a fix to one never reached the others.
#
# The alternative that was rejected: a `test-if-present` gate installed in all 66. That reports
# green when nothing ran, so a repo with no tests renders identically to one whose suite passed —
# the fail-open pattern that has repeatedly produced "green check that can't see failure" defects
# in this estate. This workflow refuses to do that: when a repo has no runnable suite it reports
# UNTESTED and fails the job unless the repo has explicitly declared itself untested. A repo is
# never silently green.
#
# Called by a repo with:
#   jobs:
#     ci:
#       uses: aerodeck-ai/.github/.github/workflows/ci.yml@main

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label. Defaults to 'ci-aeros' — the Linux business CI box — NOT the bare
          'self-hosted' label, which matches all three org runners including mac-mini-runner-1 and
          personal-runner-1. 'personal' is the LIFE host and business CI must not schedule onto it.
          Override only when a repo genuinely needs another box: 'mac-mini' for macOS-only work,
          'ubuntu-latest' for GitHub-hosted.
        type: string
        default: ci-aeros
        required: false
      node-version:
        type: string
        default: '22'
        required: false
      test-command:
        description: >-
          Override the auto-detected test command. Only set this when detection gets it wrong —
          an explicit wrong command is worse than no command, because it can pass vacuously.
        type: string
        default: ''
        required: false
      declared-untested:
        description: >-
          Set true ONLY for a repo that genuinely has no suite and is knowingly unproven. The job
          then reports UNTESTED and succeeds, so the board stays honest without going red forever.
          This is a deliberate, visible, per-repo admission — not a default.
        type: boolean
        default: false
        required: false
      skip-if-docs-only:
        description: >-
          Opt in to the build-irrelevant skip (jiddlers#488, estate-work#2680). On a pull request
          the job runs the CALLING repository's own scripts/check-docs-only.mjs against the merge
          base; when it reports docs-only, install and tests are skipped and the job says so in
          its own words, still reporting success so a required context resolves. The decision is
          the caller's one script, never a second definition here (#2390). If the caller has no
          such script the step fails closed and everything runs. Off by default: callers that do
          not pass this see byte-identical behaviour.
        type: boolean
        default: false
        required: false

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The classifier below diffs against the merge base; a shallow clone makes it fail
          # closed and run everything (aerodeck-template#2465). Full history only when opted in.
          fetch-depth: ${{ inputs.skip-if-docs-only && '0' || '1' }}

      # Is this diff worth installing for? Only when the caller opted in, only on a pull request,
      # and only by the caller's own scripts/check-docs-only.mjs (jiddlers#488). Absent script,
      # empty or unparseable diff: not docs-only, everything below runs.
      - name: is this diff build-irrelevant?
        id: docs_only
        if: inputs.skip-if-docs-only && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f scripts/check-docs-only.mjs ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "not docs-only: this repository has no scripts/check-docs-only.mjs; running the full gate."
            exit 0
          fi
          git fetch -q origin "${{ github.event.pull_request.base.ref }}"
          node scripts/check-docs-only.mjs \
            "origin/${{ github.event.pull_request.base.ref }}" \
            "${{ github.event.pull_request.head.sha }}"

      # A skip must never read like a pass (the 2026-08-10 lesson, kept in every gate).
      - name: say plainly that nothing needed installing or testing
        if: steps.docs_only.outputs.docs_only == 'true'
        shell: bash
        run: |
          echo "BUILD-IRRELEVANT SKIP (jiddlers#488) - this diff changes nothing the product is built from."
          echo "Install and tests were not run. This is NOT a passing test run."
          echo "### BUILD-IRRELEVANT SKIP" >> "$GITHUB_STEP_SUMMARY"
          echo "Prose-only diff by the calling repository's scripts/check-docs-only.mjs; install and tests not run." >> "$GITHUB_STEP_SUMMARY"

      # Detect rather than assume. A repo with no package.json and no pyproject.toml has no suite
      # this workflow knows how to run, and saying so is the point.
      - name: Detect suite
        id: detect
        if: steps.docs_only.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -uo pipefail
          cmd=""
          kind="none"
          if [ -n "${{ inputs.test-command }}" ]; then
            cmd="${{ inputs.test-command }}"; kind="explicit"
          elif [ -f package.json ]; then
            # `npm test` with no test script exits 1 on modern npm, but older/odd setups emit the
            # "no test specified" stub and exit 0 — the exact vacuous pass this file exists to stop.
            # So read the script rather than trusting the exit code.
            script="$(node -p "require('./package.json').scripts?.test || ''" 2>/dev/null || echo '')"
            case "$script" in
              ''|*'no test specified'*) kind="none" ;;
              *) cmd="npm test"; kind="node" ;;
            esac
          elif [ -f pyproject.toml ] || [ -f pytest.ini ] || [ -d tests ]; then
            cmd="python -m pytest -q"; kind="python"
          fi
          echo "cmd=$cmd"   >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Detected: kind=$kind cmd=${cmd:-<none>}"

      - name: Setup Node
        if: steps.docs_only.outputs.docs_only != 'true' && steps.detect.outputs.kind == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install (node)
        if: steps.docs_only.outputs.docs_only != 'true' && steps.detect.outputs.kind == 'node'
        shell: bash
        run: npm ci || npm install

      # Python dependency install. Without this a Python repo runs pytest against whatever happens
      # to be on the runner, so a missing dependency reads as a test failure and a shared runner
      # slowly accumulates every repo's packages. Everything goes into a per-job venv, never the
      # runner's system Python — the runner is shared across all repos and must stay clean.
      # The venv is named with a leading dot so pytest's default norecursedirs ('.*') skips it.
      - name: Install (python)
        if: steps.docs_only.outputs.docs_only != 'true' && (steps.detect.outputs.kind == 'python' || steps.detect.outputs.kind == 'explicit')
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f requirements.txt ] && [ ! -f pyproject.toml ] && [ ! -f setup.py ]; then
            echo "No Python dependency manifest; skipping install."
            exit 0
          fi
          python3 -m venv .ci-venv || { echo "::error::could not create venv"; exit 1; }
          . .ci-venv/bin/activate
          python -m pip install --upgrade pip --quiet
          # requirements.txt is an explicit declaration of what this repo needs. If it cannot be
          # installed, the suite cannot be trusted, so fail here rather than let pytest report a
          # misleading ImportError as though it were a test result.
          if [ -f requirements.txt ]; then
            pip install --quiet -r requirements.txt || { echo "::error::requirements.txt install failed"; exit 1; }
          fi
          # A pyproject/setup.py may be config-only (ruff, black) rather than an installable
          # package, so a failure here is a warning, not a verdict.
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            pip install --quiet -e . 2>/dev/null \
              || pip install --quiet . 2>/dev/null \
              || echo "::warning::repo is not pip-installable; continuing on requirements.txt alone"
          fi
          python -m pytest --version >/dev/null 2>&1 || pip install --quiet pytest
          # Write the manifest to a file before trimming it. Piping pip straight into `head` closes
          # the pipe early, pip exits 120 on the broken pipe, and `pipefail` makes that the step's
          # exit code — a logging line failing the build.
          echo "Installed into .ci-venv:"
          pip list --format=freeze > .ci-venv/installed.txt 2>/dev/null || true
          head -40 .ci-venv/installed.txt || true

      - name: Run tests
        if: steps.docs_only.outputs.docs_only != 'true' && steps.detect.outputs.kind != 'none'
        shell: bash
        run: |
          if [ -d .ci-venv ]; then . .ci-venv/bin/activate; fi
          ${{ steps.detect.outputs.cmd }}

      # The honest-board step. No suite => this is NOT a pass.
      - name: No suite — report UNTESTED
        if: steps.docs_only.outputs.docs_only != 'true' && steps.detect.outputs.kind == 'none'
        shell: bash
        run: |
          echo "### UNTESTED" >> "$GITHUB_STEP_SUMMARY"
          echo "No runnable test suite was detected in this repository." >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.declared-untested }}" = "true" ]; then
            echo "This repo has explicitly declared itself untested (declared-untested: true)." >> "$GITHUB_STEP_SUMMARY"
            echo "Recorded as a known state, not as a passing suite." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Failing deliberately: a green tick here would be indistinguishable from a passing suite." >> "$GITHUB_STEP_SUMMARY"
          echo "Either add a suite, or set 'declared-untested: true' in the caller to record this repo as knowingly unproven." >> "$GITHUB_STEP_SUMMARY"
          exit 1
